    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">Synced SKUs</text>
    <circle cx="282" cy="32" r="10" fill="#F1F5F9" />
    <text x="279" y="36" font-size="12" font-weight="700" fill="#64748B">i</text>
    <text x="24" y="98" font-size="38" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">350+ Live</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#94A3B8">Automated Arabic localization</text>
  </g>


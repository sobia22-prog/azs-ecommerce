      <line x1="85" y1="4" x2="1320" y2="4" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Line 2 -->
      <text x="0" y="98" font-size="13" font-weight="600" fill="#94A3B8">SAR 120k</text>
      <line x1="85" y1="94" x2="1320" y2="94" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Line 3 -->
      <text x="0" y="188" font-size="13" font-weight="600" fill="#94A3B8">SAR 90k</text>
      <line x1="85" y1="184" x2="1320" y2="184" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Line 4 -->
      <text x="0" y="278" font-size="13" font-weight="600" fill="#94A3B8">SAR 60k</text>
      <line x1="85" y1="274" x2="1320" y2="274" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Line 5 -->
      <text x="0" y="368" font-size="13" font-weight="600" fill="#94A3B8">SAR 30k</text>
      <line x1="85" y1="364" x2="1320" y2="364" stroke="#F1F5F9" stroke-width="1.5" />
    </g>


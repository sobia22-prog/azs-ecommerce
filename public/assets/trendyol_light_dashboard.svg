  <g transform="translate(130, 105)" filter="url(#shadow)">
    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">GCC Run-Rate</text>
    <rect x="235" y="20" width="66" height="26" rx="8" fill="#FFF7ED" stroke="#FFEDD5" stroke-width="1.2" />
    <text x="245" y="38" font-size="13" font-weight="800" fill="#EA580C">+240%</text>
    <text x="24" y="98" font-size="36" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">SAR 145,000</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#94A3B8">Annualized GCC sales pacing</text>

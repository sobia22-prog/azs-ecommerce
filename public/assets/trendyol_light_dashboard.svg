    <g transform="translate(121, 104)">
      <!-- Shaded Gradient Area Under Curve -->
      <path d="M 0 360 
               C 120 355, 200 340, 280 330 
               C 360 320, 440 310, 520 280 
               C 600 250, 680 230, 760 210 
               C 840 190, 920 140, 1000 130 
               C 1080 120, 1160 40, 1235 15 
               L 1235 364 L 0 364 Z" 
            fill="url(#trendyolGrad)" />

      <!-- Main Vibrant Orange Curve -->
      <path d="M 0 360 
               C 120 355, 200 340, 280 330 
               C 360 320, 440 310, 520 280 
               C 600 250, 680 230, 760 210 
               C 840 190, 920 140, 1000 130 
               C 1080 120, 1160 40, 1235 15" 
            fill="none" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" />

      <!-- Data Dots on Milestones -->
      <circle cx="280" cy="330" r="5.5" fill="#FFFFFF" stroke="#F27A1A" stroke-width="3" />
      <circle cx="520" cy="280" r="5.5" fill="#FFFFFF" stroke="#F27A1A" stroke-width="3" />
      <circle cx="760" cy="210" r="5.5" fill="#FFFFFF" stroke="#F27A1A" stroke-width="3" />
      <circle cx="1000" cy="130" r="5.5" fill="#FFFFFF" stroke="#F27A1A" stroke-width="3" />

      <!-- Highlight Peak Callout at the top right -->

    <text x="24" y="98" font-size="38" font-weight="900" fill="#EA580C" letter-spacing="-0.03em">+240%</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#94A3B8">Cross-border volume acceleration</text>

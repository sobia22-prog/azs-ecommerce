        <path d="M 160 48 L 165 54 L 170 48 Z" fill="#0F172A" transform="translate(0, 0)" />
        <text x="14" y="22" font-size="12" font-weight="700" fill="#FED7AA">FLASH RUN-RATE</text>
        <text x="14" y="40" font-size="15" font-weight="900" fill="#FFFFFF">SAR 145,000</text>

      <path d="M12 15 l4 4 l8 -9" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(4, -1)" />
      <text x="34" y="20" font-size="13" font-weight="700" fill="#1D4ED8">Verified Partner</text>

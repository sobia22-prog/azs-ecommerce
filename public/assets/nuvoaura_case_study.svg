<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    </style>
    <linearGradient id="bgNuvo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#F2FAF4" />
      <stop offset="100%" stop-color="#E8F6ED" />
    </linearGradient>
    <linearGradient id="glassCardNuvo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#F0FDF4" stop-opacity="0.93" />
    </linearGradient>
    <linearGradient id="chartGreenNuvo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F59B" />
    </linearGradient>
    <filter id="softGlowNuvo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#10B981" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Bright Studio Background -->
  <rect width="1600" height="900" fill="url(#bgNuvo)" />
  
  <!-- Subtle Soft Light Flares -->
  <circle cx="200" cy="180" r="280" fill="#FFFFFF" opacity="0.6" filter="blur(40px)" />
  <circle cx="1400" cy="700" r="300" fill="#A7F3D0" opacity="0.18" filter="blur(50px)" />

  <!-- Left Side: Luxury Beauty & Cosmetics Product Showcase -->
  <g transform="translate(100, 140)">
    <!-- White Marble Vanity Pedestal -->
    <ellipse cx="320" cy="580" rx="260" ry="40" fill="#E2E8F0" opacity="0.6" />
    <rect x="80" y="560" width="480" height="25" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Cosmetic Serum Dropper Bottle (Matte Glass) -->
    <g transform="translate(160, 260)">
      <!-- Bottle Body -->
      <rect x="30" y="90" width="80" height="190" rx="20" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2" />
      <rect x="42" y="130" width="56" height="85" rx="6" fill="#FFFFFF" />
      <text x="70" y="160" font-size="10" font-weight="800" fill="#047857" text-anchor="middle">NUVOAURA</text>
      <text x="70" y="175" font-size="7" font-weight="700" fill="#65A30D" text-anchor="middle">SERUM 30ML</text>
      <text x="70" y="195" font-size="8" font-weight="800" fill="#0F172A" text-anchor="middle">ORGANIC</text>
      <!-- Dropper Neck & Cap -->
      <rect x="52" y="65" width="36" height="25" fill="#D97706" rx="4" />
      <path d="M 60,65 C 60,35 80,35 80,65 Z" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" />
    </g>

    <!-- Luxury Cosmetic Cream Jar -->
    <g transform="translate(300, 360)">
      <!-- Jar Base -->
      <rect x="20" y="70" width="130" height="105" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
      <rect x="35" y="105" width="100" height="45" rx="6" fill="#F0FDF4" />
      <text x="85" y="132" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">HYDRATING BALM</text>
      <!-- Jar Metallic Rose/Gold Lid -->
      <rect x="15" y="45" width="140" height="28" rx="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5" />
    </g>

    <!-- Fresh Green Botanical Leaves / Aloe -->
    <path d="M 120,440 C 90,340 100,240 160,180 C 140,240 140,340 120,440 Z" fill="#34D399" opacity="0.85" />
    <path d="M 460,420 C 510,320 500,220 440,160 C 470,220 480,320 460,420 Z" fill="#10B981" opacity="0.85" />
    <ellipse cx="140" cy="270" rx="35" ry="12" transform="rotate(-35 140 270)" fill="#6EE7B7" />
    <ellipse cx="460" cy="250" rx="38" ry="14" transform="rotate(30 460 250)" fill="#059669" />

    <!-- Hanging Brand Header -->
    <rect x="90" y="80" width="370" height="56" rx="28" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2" filter="url(#softGlowNuvo)" />
    <text x="120" y="116" font-size="22" font-weight="800" fill="#047857">NUVOAURA BEAUTY</text>
    <text x="350" y="116" font-size="14" font-weight="700" fill="#10B981">AMAZON USA</text>
  </g>

  <!-- Right Side: Large Glassmorphic Bright Green Performance Card -->
  <g transform="translate(760, 100)" filter="url(#softGlowNuvo)">
    <rect width="740" height="700" rx="32" fill="url(#glassCardNuvo)" stroke="#A7F3D0" stroke-width="2.5" />

    <!-- Top Badge -->
    <g transform="translate(50, 50)">
      <rect width="280" height="42" rx="21" fill="#DCFCE7" />
      <circle cx="24" cy="21" r="7" fill="#10B981" />
      <text x="42" y="27" font-size="15" font-weight="800" fill="#047857">AMAZON USA ACCELERATION</text>
    </g>

    <!-- Header Text -->
    <text x="50" y="150" font-size="20" font-weight="700" fill="#64748B" letter-spacing="1">BEAUTY &amp; WELLNESS PERFORMANCE</text>
    <text x="50" y="225" font-size="64" font-weight="900" fill="#065F46">+507%</text>
    <text x="320" y="225" font-size="44" font-weight="800" fill="#10B981">Growth</text>

    <!-- Subtitle Metric -->
    <text x="50" y="275" font-size="24" font-weight="700" fill="#334155">$48,900 Attributed Ad Sales</text>

    <!-- Upward Trend Chart -->
    <g transform="translate(50, 310)">
      <rect width="640" height="200" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
      
      <!-- Chart Line -->
      <path d="M 30,165 Q 160,155 260,115 T 440,65 T 600,20" fill="none" stroke="url(#chartGreenNuvo)" stroke-width="6" stroke-linecap="round" />
      <!-- Area Fill -->
      <path d="M 30,165 Q 160,155 260,115 T 440,65 T 600,20 L 600,185 L 30,185 Z" fill="#10B981" opacity="0.12" />

      <!-- Peak Point Marker -->
      <circle cx="600" cy="20" r="10" fill="#047857" stroke="#FFFFFF" stroke-width="4" />
      
      <!-- High Point Badge -->
      <rect x="460" y="8" width="125" height="30" rx="8" fill="#047857" />
      <text x="522" y="28" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">11.20x ROAS</text>
    </g>

    <!-- KPI Matrix Bottom -->
    <g transform="translate(50, 540)">
      <rect x="0" y="0" width="195" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="24" y="34" font-size="13" font-weight="700" fill="#94A3B8">TARGET ACOS</text>
      <text x="24" y="70" font-size="24" font-weight="900" fill="#047857">8.90%</text>

      <rect x="220" y="0" width="195" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="244" y="34" font-size="13" font-weight="700" fill="#94A3B8">AD SPEND</text>
      <text x="244" y="70" font-size="24" font-weight="900" fill="#0F172A">$4,360</text>

      <rect x="440" y="0" width="200" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="464" y="34" font-size="13" font-weight="700" fill="#94A3B8">DSP ATTRIBUTION</text>
      <text x="464" y="70" font-size="20" font-weight="800" fill="#047857">100% Verified</text>
    </g>
  </g>
</svg>

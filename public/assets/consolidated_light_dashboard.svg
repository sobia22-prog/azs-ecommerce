               C 100 340, 200 330, 280 300 
               C 360 270, 440 230, 520 190 
               C 600 150, 680 160, 760 120 
               C 840 80, 920 60, 1000 50 
               C 1080 40, 1160 20, 1245 10 
               L 1245 364 L 0 364 Z" 

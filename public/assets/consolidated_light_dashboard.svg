        <text x="14" y="22" font-size="12" font-weight="700" fill="#6EE7B7">AUDITED RUN-RATE</text>
        <text x="14" y="40" font-size="15" font-weight="900" fill="#FFFFFF">$142,850,000 GMV</text>

      <!-- Main Vibrant Emerald to Cyan Curve -->
      <path d="M 0 350 
               C 100 340, 200 330, 280 300 
               C 360 270, 440 230, 520 190 
               C 600 150, 680 160, 760 120 
               C 840 80, 920 60, 1000 50 
               C 1080 40, 1160 20, 1245 10" 
            fill="none" stroke="url(#lineGradCons)" stroke-width="4.5" stroke-linecap="round" />

      <!-- Data Dots on Milestones -->
      <circle cx="280" cy="300" r="5.5" fill="#FFFFFF" stroke="#059669" stroke-width="3" />
      <circle cx="520" cy="190" r="5.5" fill="#FFFFFF" stroke="#059669" stroke-width="3" />
      <circle cx="760" cy="120" r="5.5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3" />
      <circle cx="1000" cy="50" r="5.5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3" />


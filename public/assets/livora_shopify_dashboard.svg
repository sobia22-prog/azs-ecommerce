<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="shopifyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#95BF47" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#95BF47" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#95BF47" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="lineGradShopify" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E8E3E" />
      <stop offset="50%" stop-color="#95BF47" />
      <stop offset="100%" stop-color="#00F59B" />
    </linearGradient>
  </defs>

  <!-- App Shell Background -->
  <rect width="1600" height="900" fill="#F8FAFC" />

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="90" height="900" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <!-- Shopify Brand Icon in Sidebar -->
  <g transform="translate(24, 28)">
    <rect width="42" height="42" rx="10" fill="#95BF47" />
    <path d="M12 16 L30 16 M21 16 L21 30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sidebar Nav Icons -->
  <g transform="translate(32, 120)">
    <rect x="-8" y="-8" width="42" height="42" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
    <path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zm0 9h7v7h-7v-7zm-9 0h7v7H4v-7z" fill="#16A34A" />
  </g>
  <g transform="translate(32, 190)" fill="#94A3B8">
    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
  </g>
  <g transform="translate(32, 260)" fill="#94A3B8">
    <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z" />
  </g>
  <g transform="translate(32, 330)" fill="#94A3B8">
    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
  </g>
  <g transform="translate(32, 830)" fill="#94A3B8">
    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(130, 42)">
    <text x="0" y="24" font-size="25" font-weight="800" fill="#0F172A">Shopify Plus Analytics — LIVORA Modern Essentials (Global DTC)</text>
    <!-- Verified Partner Badge -->
    <g transform="translate(860, 2)">
      <rect width="144" height="30" rx="15" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
      <path d="M12 15 l4 4 l8 -9" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(4, -1)" />
      <text x="34" y="20" font-size="13" font-weight="700" fill="#15803D">Shopify Plus</text>
    </g>
    <!-- Right Actions -->
    <g transform="translate(1360, 2)">
      <circle cx="15" cy="15" r="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="11" y="21" font-size="15" font-weight="700" fill="#64748B">?</text>
      <circle cx="58" cy="15" r="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M54 11 h8 v8 h-8 z M50 15 h8" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- 4 KPI Metric Cards -->
  <!-- Card 1: Monthly Sales ($50,461.90) -->
  <g transform="translate(130, 105)" filter="url(#shadow)">
    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">Monthly Net Sales</text>
    <rect x="235" y="20" width="66" height="26" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" />
    <text x="245" y="38" font-size="13" font-weight="800" fill="#16A34A">+104%</text>
    <text x="24" y="98" font-size="33" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">$50,461.90</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#16A34A">SAR 189,200 monthly volume</text>
  </g>

  <!-- Card 2: Total Orders (1,680 Units) -->
  <g transform="translate(485, 105)" filter="url(#shadow)">
    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">Total Orders</text>
    <circle cx="282" cy="32" r="10" fill="#F1F5F9" />
    <text x="279" y="36" font-size="12" font-weight="700" fill="#64748B">i</text>
    <text x="24" y="98" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">1,680 Units</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#16A34A">+122% Checkout volume</text>
  </g>

  <!-- Card 3: Conversion Rate (3.82%) -->
  <g transform="translate(840, 105)" filter="url(#shadow)">
    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">Store Conversion Rate</text>
    <circle cx="282" cy="32" r="10" fill="#F1F5F9" />
    <text x="279" y="36" font-size="12" font-weight="700" fill="#64748B">i</text>
    <text x="24" y="98" font-size="36" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">3.82%</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#16A34A">Up from 1.69% baseline</text>
  </g>

  <!-- Card 4: Blended ROAS (4.62x) -->
  <g transform="translate(1195, 105)" filter="url(#shadow)">
    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">Blended ROAS</text>
    <circle cx="282" cy="32" r="10" fill="#F1F5F9" />
    <text x="279" y="36" font-size="12" font-weight="700" fill="#64748B">i</text>
    <text x="24" y="98" font-size="36" font-weight="900" fill="#16A34A" letter-spacing="-0.03em">4.62x</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#94A3B8">Meta + TikTok creator sandbox</text>
  </g>

  <!-- Large Chart Card -->
  <g transform="translate(130, 285)" filter="url(#shadow)">
    <rect width="1390" height="565" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Chart Header -->
    <text x="36" y="48" font-size="20" font-weight="800" fill="#0F172A">Shopify Storefront Omnichannel Gross Sales</text>
    <circle cx="485" cy="42" r="9" fill="#F1F5F9" />
    <text x="482" y="46" font-size="11" font-weight="700" fill="#64748B">i</text>
    
    <!-- Legend -->
    <circle cx="980" cy="42" r="6" fill="#16A34A" />
    <text x="996" y="47" font-size="14" font-weight="600" fill="#475569">Shopify Checkout (Mada / Apple Pay)</text>
    <circle cx="1270" cy="42" r="6" fill="#06B6D4" />
    <text x="1286" y="47" font-size="14" font-weight="600" fill="#475569">Tamara &amp; Tabby BNPL</text>

    <!-- Date Filter Dropdown -->
    <rect x="1230" y="24" width="130" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="1244" y="46" font-size="13" font-weight="600" fill="#475569">Trailing 60 Days ▾</text>

    <!-- Grid Lines & Y-Axis Labels -->
    <g transform="translate(36, 100)">
      <text x="0" y="8" font-size="13" font-weight="600" fill="#94A3B8">$55k</text>
      <line x1="65" y1="4" x2="1320" y2="4" stroke="#F1F5F9" stroke-width="1.5" />

      <text x="0" y="98" font-size="13" font-weight="600" fill="#94A3B8">$40k</text>
      <line x1="65" y1="94" x2="1320" y2="94" stroke="#F1F5F9" stroke-width="1.5" />

      <text x="0" y="188" font-size="13" font-weight="600" fill="#94A3B8">$25k</text>
      <line x1="65" y1="184" x2="1320" y2="184" stroke="#F1F5F9" stroke-width="1.5" />

      <text x="0" y="278" font-size="13" font-weight="600" fill="#94A3B8">$10k</text>
      <line x1="65" y1="274" x2="1320" y2="274" stroke="#F1F5F9" stroke-width="1.5" />

      <text x="0" y="368" font-size="13" font-weight="600" fill="#94A3B8">$0k</text>
      <line x1="65" y1="364" x2="1320" y2="364" stroke="#F1F5F9" stroke-width="1.5" />
    </g>

    <!-- Chart Smooth Area & Curve -->
    <g transform="translate(101, 104)">
      <!-- Shaded Gradient Area Under Curve -->
      <path d="M 0 350 
               C 100 340, 200 320, 300 300 
               C 400 280, 500 240, 600 210 
               C 700 180, 800 170, 900 110 
               C 1000 60, 1120 40, 1255 14 
               L 1255 364 L 0 364 Z" 
            fill="url(#shopifyGrad)" />

      <!-- Main Vibrant Green Curve -->
      <path d="M 0 350 
               C 100 340, 200 320, 300 300 
               C 400 280, 500 240, 600 210 
               C 700 180, 800 170, 900 110 
               C 1000 60, 1120 40, 1255 14" 
            fill="none" stroke="url(#lineGradShopify)" stroke-width="4.5" stroke-linecap="round" />

      <circle cx="300" cy="300" r="5.5" fill="#FFFFFF" stroke="#16A34A" stroke-width="3" />
      <circle cx="600" cy="210" r="5.5" fill="#FFFFFF" stroke="#16A34A" stroke-width="3" />
      <circle cx="900" cy="110" r="5.5" fill="#FFFFFF" stroke="#16A34A" stroke-width="3" />

      <!-- Highlight Peak Callout at the top right -->
      <circle cx="1255" cy="14" r="7.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="3" />
      <g transform="translate(1040, -48)">
        <rect width="215" height="48" rx="8" fill="#0F172A" />
        <text x="14" y="22" font-size="12" font-weight="700" fill="#BBF7D0">MONTHLY RECORD</text>
        <text x="14" y="40" font-size="15" font-weight="900" fill="#FFFFFF">$50,461.90 / 1.68K Orders</text>
      </g>
    </g>

    <!-- X-Axis Dates -->
    <g transform="translate(101, 505)" font-size="13" font-weight="600" fill="#94A3B8">
      <text x="0" y="0">Day 1</text>
      <text x="250" y="0">Day 15</text>
      <text x="500" y="0">Day 30</text>
      <text x="750" y="0">Day 45</text>
      <text x="1000" y="0">Day 55</text>
      <text x="1200" y="0">Day 60 (Scale)</text>
    </g>
  </g>
</svg>

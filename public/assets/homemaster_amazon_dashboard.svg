      <path d="M 0 355 
               C 120 350, 220 340, 320 320 
               C 420 300, 500 280, 600 230 
               C 700 180, 800 190, 900 130 
               C 1000 70, 1100 40, 1255 12 
               L 1255 364 L 0 364 Z" 
            fill="url(#amzGrad)" />

      <!-- Main Vibrant Green Curve -->
      <path d="M 0 355 
               C 120 350, 220 340, 320 320 
               C 420 300, 500 280, 600 230 
               C 700 180, 800 190, 900 130 
               C 1000 70, 1100 40, 1255 12" 
            fill="none" stroke="url(#lineGradAmz)" stroke-width="4.5" stroke-linecap="round" />

      <circle cx="320" cy="320" r="5.5" fill="#FFFFFF" stroke="#059669" stroke-width="3" />
      <circle cx="600" cy="230" r="5.5" fill="#FFFFFF" stroke="#059669" stroke-width="3" />
      <circle cx="900" cy="130" r="5.5" fill="#FFFFFF" stroke="#059669" stroke-width="3" />


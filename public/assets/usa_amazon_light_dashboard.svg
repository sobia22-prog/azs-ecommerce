<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="usaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="lineGradUSA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- App Shell Background -->
  <rect width="1600" height="900" fill="#F8FAFC" />

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="90" height="900" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  
  <!-- Amazon Brand Icon in Sidebar -->
  <g transform="translate(24, 28)">
    <rect width="42" height="42" rx="10" fill="#0F172A" />
    <text x="14" y="29" font-size="24" font-weight="900" fill="#FF9900">a</text>
  </g>

  <!-- Sidebar Nav Icons -->
  <g transform="translate(32, 120)">
    <!-- Active Dashboard Icon -->
    <rect x="-8" y="-8" width="42" height="42" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
    <path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zm0 9h7v7h-7v-7zm-9 0h7v7H4v-7z" fill="#0284C7" />
  </g>
  <g transform="translate(32, 190)" fill="#94A3B8">
    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
  </g>
  <g transform="translate(32, 260)" fill="#94A3B8">
    <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z" />
  </g>
  <g transform="translate(32, 330)" fill="#94A3B8">
    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
  </g>
  <g transform="translate(32, 830)" fill="#94A3B8">
    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(130, 42)">
    <text x="0" y="24" font-size="26" font-weight="800" fill="#0F172A">USA Marketplace Advertising Engine (Amazon.com)</text>
    <!-- Verified Partner Badge -->
    <g transform="translate(710, 2)">
      <rect width="144" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2" />
      <path d="M12 15 l4 4 l8 -9" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(4, -1)" />
      <text x="34" y="20" font-size="13" font-weight="700" fill="#1D4ED8">Verified Partner</text>
    </g>
    <!-- Right Actions -->
    <g transform="translate(1360, 2)">
      <circle cx="15" cy="15" r="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="11" y="21" font-size="15" font-weight="700" fill="#64748B">?</text>
      <circle cx="58" cy="15" r="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <path d="M54 11 h8 v8 h-8 z M50 15 h8" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- 4 KPI Metric Cards (Matching sidebar stats) -->
  <!-- Card 1: Total Ad Sales ($48,900.00) -->
  <g transform="translate(130, 105)" filter="url(#shadow)">
    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">Total Ad Sales</text>
    <rect x="235" y="20" width="66" height="26" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2" />
    <text x="245" y="38" font-size="13" font-weight="800" fill="#059669">+82.4%</text>
    <text x="24" y="98" font-size="36" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">$48,900.00</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#94A3B8">Amazon SP &amp; SB gross revenue</text>
  </g>

  <!-- Card 2: Verified ROAS (11.20x) -->
  <g transform="translate(485, 105)" filter="url(#shadow)">
    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">Verified ROAS</text>
    <circle cx="282" cy="32" r="10" fill="#F1F5F9" />
    <text x="279" y="36" font-size="12" font-weight="700" fill="#64748B">i</text>
    <text x="24" y="98" font-size="38" font-weight="900" fill="#059669" letter-spacing="-0.03em">11.20x</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#059669">High-margin keyword harvesting</text>
  </g>

  <!-- Card 3: ACOS Efficiency (8.90%) -->
  <g transform="translate(840, 105)" filter="url(#shadow)">
    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">ACOS Efficiency</text>
    <circle cx="282" cy="32" r="10" fill="#F1F5F9" />
    <text x="279" y="36" font-size="12" font-weight="700" fill="#64748B">i</text>
    <text x="24" y="98" font-size="38" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">8.90%</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#10B981">Ultra-lean advertising cost</text>
  </g>

  <!-- Card 4: Total Ad Spend ($4,360.00) -->
  <g transform="translate(1195, 105)" filter="url(#shadow)">
    <rect width="325" height="152" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="24" y="38" font-size="15" font-weight="700" fill="#64748B">Total Ad Spend</text>
    <circle cx="282" cy="32" r="10" fill="#F1F5F9" />
    <text x="279" y="36" font-size="12" font-weight="700" fill="#64748B">i</text>
    <text x="24" y="98" font-size="38" font-weight="900" fill="#0F172A" letter-spacing="-0.03em">$4,360.00</text>
    <text x="24" y="128" font-size="13" font-weight="600" fill="#94A3B8">Controlled bid governance</text>
  </g>

  <!-- Large Chart Card: Amazon Ad Sales & ROAS Scaling -->
  <g transform="translate(130, 285)" filter="url(#shadow)">
    <rect width="1390" height="565" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Chart Header -->
    <text x="36" y="48" font-size="20" font-weight="800" fill="#0F172A">Amazon Sponsored Ads Revenue Growth Curve</text>
    <circle cx="485" cy="42" r="9" fill="#F1F5F9" />
    <text x="482" y="46" font-size="11" font-weight="700" fill="#64748B">i</text>
    
    <!-- Legend -->
    <circle cx="980" cy="42" r="6" fill="#0284C7" />
    <text x="996" y="47" font-size="14" font-weight="600" fill="#475569">Sponsored Products (SP)</text>
    <circle cx="1180" cy="42" r="6" fill="#10B981" />
    <text x="1196" y="47" font-size="14" font-weight="600" fill="#475569">Sponsored Brands (SB)</text>

    <!-- Date Filter Dropdown -->
    <rect x="1230" y="24" width="130" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
    <text x="1244" y="46" font-size="13" font-weight="600" fill="#475569">Trailing 90 Days ▾</text>

    <!-- Grid Lines & Y-Axis Labels -->
    <g transform="translate(36, 100)">
      <!-- Line 1 -->
      <text x="0" y="8" font-size="13" font-weight="600" fill="#94A3B8">$50k</text>
      <line x1="65" y1="4" x2="1320" y2="4" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Line 2 -->
      <text x="0" y="98" font-size="13" font-weight="600" fill="#94A3B8">$40k</text>
      <line x1="65" y1="94" x2="1320" y2="94" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Line 3 -->
      <text x="0" y="188" font-size="13" font-weight="600" fill="#94A3B8">$30k</text>
      <line x1="65" y1="184" x2="1320" y2="184" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Line 4 -->
      <text x="0" y="278" font-size="13" font-weight="600" fill="#94A3B8">$20k</text>
      <line x1="65" y1="274" x2="1320" y2="274" stroke="#F1F5F9" stroke-width="1.5" />

      <!-- Line 5 -->
      <text x="0" y="368" font-size="13" font-weight="600" fill="#94A3B8">$10k</text>
      <line x1="65" y1="364" x2="1320" y2="364" stroke="#F1F5F9" stroke-width="1.5" />
    </g>

    <!-- Chart Smooth Area & Curve -->
    <g transform="translate(101, 104)">
      <!-- Shaded Gradient Area Under Curve -->
      <path d="M 0 350 
               C 100 340, 200 330, 280 310 
               C 360 290, 440 260, 520 230 
               C 600 200, 680 180, 760 140 
               C 840 100, 920 110, 1000 80 
               C 1080 50, 1160 30, 1255 12 
               L 1255 364 L 0 364 Z" 
            fill="url(#usaGrad)" />

      <!-- Main Vibrant Blue to Green Curve -->
      <path d="M 0 350 
               C 100 340, 200 330, 280 310 
               C 360 290, 440 260, 520 230 
               C 600 200, 680 180, 760 140 
               C 840 100, 920 110, 1000 80 
               C 1080 50, 1160 30, 1255 12" 
            fill="none" stroke="url(#lineGradUSA)" stroke-width="4.5" stroke-linecap="round" />

      <!-- Data Dots on Milestones -->
      <circle cx="280" cy="310" r="5.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
      <circle cx="520" cy="230" r="5.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
      <circle cx="760" cy="140" r="5.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
      <circle cx="1000" cy="80" r="5.5" fill="#FFFFFF" stroke="#10B981" stroke-width="3" />

      <!-- Highlight Peak Callout at the top right -->
      <circle cx="1255" cy="12" r="7.5" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
      <g transform="translate(1085, -48)">
        <rect width="170" height="48" rx="8" fill="#0F172A" />
        <text x="14" y="22" font-size="12" font-weight="700" fill="#6EE7B7">11.20x ROAS PEAK</text>
        <text x="14" y="40" font-size="15" font-weight="900" fill="#FFFFFF">$48,900.00 Sales</text>
      </g>
    </g>

    <!-- X-Axis Dates -->
    <g transform="translate(101, 505)" font-size="13" font-weight="600" fill="#94A3B8">
      <text x="0" y="0">Month 1</text>
      <text x="260" y="0">Month 2</text>
      <text x="520" y="0">Month 3</text>
      <text x="760" y="0">Month 4</text>
      <text x="1000" y="0">Month 5</text>
      <text x="1210" y="0">Active US Pace</text>
    </g>

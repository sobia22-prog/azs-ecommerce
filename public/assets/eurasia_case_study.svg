<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    </style>
    <linearGradient id="bgEurasia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFBF9" />
      <stop offset="50%" stop-color="#F4F6F0" />
      <stop offset="100%" stop-color="#EAF2E8" />
    </linearGradient>
    <linearGradient id="glassCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F0FDF4" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="chartGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#00F59B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#059669" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Bright Studio Background -->
  <rect width="1600" height="900" fill="url(#bgEurasia)" />
  
  <!-- Subtle Sunlight Window Shadow -->
  <polygon points="0,0 600,0 300,900 0,900" fill="#FFFFFF" opacity="0.35" />

  <!-- Left Side: Home Textiles & Decor Visual Showcase -->
  <g transform="translate(100, 140)">
    <!-- Wooden Shelf & Platform -->
    <rect x="40" y="560" width="560" height="18" rx="8" fill="#D7CCC8" opacity="0.7" />

    <!-- Folded Linen Blankets & Woven Textiles Stack -->
    <rect x="90" y="450" width="460" height="42" rx="14" fill="#E2DDD5" />
    <rect x="110" y="405" width="420" height="40" rx="14" fill="#C8D6AF" />
    <rect x="130" y="360" width="380" height="40" rx="14" fill="#F5F5F0" stroke="#E2DDD5" stroke-width="2" />
    <rect x="150" y="320" width="340" height="36" rx="14" fill="#A3B899" />
    
    <!-- Decorative Ceramic Vase with Green Olive Branches -->
    <path d="M 520,560 C 510,480 470,440 480,360 L 510,360 C 520,440 560,480 550,560 Z" fill="#EFEBE9" />
    <path d="M 495,360 Q 470,220 440,160 Q 460,180 495,190" stroke="#4B6B46" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Olive Leaves -->
    <ellipse cx="440" cy="160" rx="18" ry="8" transform="rotate(-30 440 160)" fill="#688F4E" />
    <ellipse cx="465" cy="185" rx="18" ry="8" transform="rotate(25 465 185)" fill="#7E9F67" />
    <ellipse cx="485" cy="220" rx="20" ry="9" transform="rotate(-15 485 220)" fill="#5A7D43" />
    <ellipse cx="505" cy="250" rx="19" ry="9" transform="rotate(35 505 250)" fill="#7E9F67" />

    <!-- Hanging Brand Header -->
    <rect x="90" y="80" width="360" height="56" rx="28" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="2" filter="url(#softGlow)" />
    <text x="120" y="116" font-size="22" font-weight="800" fill="#065F46">EURASIA LIFESTYLE</text>
    <text x="350" y="116" font-size="14" font-weight="700" fill="#10B981">GCC LAUNCH</text>
  </g>

  <!-- Right Side: Large Glassmorphic Bright Green Performance Card -->
  <g transform="translate(760, 100)" filter="url(#softGlow)">
    <rect width="740" height="700" rx="32" fill="url(#glassCardGrad)" stroke="#A7F3D0" stroke-width="2.5" />

    <!-- Top Badge -->
    <g transform="translate(50, 50)">
      <rect width="260" height="42" rx="21" fill="#DCFCE7" />
      <circle cx="24" cy="21" r="7" fill="#10B981" />
      <text x="42" y="27" font-size="15" font-weight="800" fill="#047857">CROSS-BORDER SUCCESS</text>
    </g>

    <!-- Header Text -->
    <text x="50" y="150" font-size="20" font-weight="700" fill="#64748B" letter-spacing="1">TRENDYOL GCC MARKETPLACE SCALE</text>
    <text x="50" y="225" font-size="64" font-weight="900" fill="#065F46">+240%</text>
    <text x="320" y="225" font-size="44" font-weight="800" fill="#10B981">Lift</text>

    <!-- Subtitle Metric -->
    <text x="50" y="275" font-size="24" font-weight="700" fill="#334155">SAR 145,000 / Month Run-Rate</text>

    <!-- Upward Trend Chart -->
    <g transform="translate(50, 310)">
      <rect width="640" height="200" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
      
      <!-- Chart Line -->
      <path d="M 30,160 Q 150,150 240,110 T 420,70 T 600,25" fill="none" stroke="url(#chartGreen)" stroke-width="6" stroke-linecap="round" />
      <!-- Area Fill -->
      <path d="M 30,160 Q 150,150 240,110 T 420,70 T 600,25 L 600,185 L 30,185 Z" fill="#10B981" opacity="0.1" />

      <!-- Peak Point Marker -->
      <circle cx="600" cy="25" r="10" fill="#059669" stroke="#FFFFFF" stroke-width="4" />
      
      <!-- High Point Badge -->
      <rect x="470" y="10" width="110" height="30" rx="8" fill="#065F46" />
      <text x="525" y="30" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">7.80x ROAS</text>
    </g>

    <!-- KPI Matrix Bottom -->
    <g transform="translate(50, 540)">
      <rect x="0" y="0" width="195" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="24" y="34" font-size="13" font-weight="700" fill="#94A3B8">ACTIVE SKUS</text>
      <text x="24" y="70" font-size="24" font-weight="900" fill="#0F172A">350+ Live</text>

      <rect x="220" y="0" width="195" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="244" y="34" font-size="13" font-weight="700" fill="#94A3B8">DELIVERY SLA</text>
      <text x="244" y="70" font-size="24" font-weight="900" fill="#059669">&lt; 72 Hours</text>

      <rect x="440" y="0" width="200" height="95" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="464" y="34" font-size="13" font-weight="700" fill="#94A3B8">CORRIDOR</text>
      <text x="464" y="70" font-size="20" font-weight="800" fill="#0F172A">TR ➔ KSA/UAE</text>
    </g>
  </g>
</svg>
